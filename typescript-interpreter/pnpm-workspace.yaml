packages:
  - "packages/*"
  - "packages/adapters/*"

allowBuilds:
  esbuild: true

# pnpm blocks dependency install/build scripts by default (a safety feature, so a
# package can't run arbitrary code on install). Vitest's compiler, esbuild, needs
# its install script to set up its native binary, so we allow just that one.
onlyBuiltDependencies:
  - esbuild

# Transitive dependencies of @modelcontextprotocol/sdk (its server-side packages) pinned to patched
# releases. The browser bundle does not include them; this keeps the install free of known advisories.
overrides:
  fast-uri: ">=3.1.6"
  ip-address: ">=10.3.1"
  hono: ">=4.13.5"
  "@hono/node-server": ">=1.19.15"
  qs: ">=6.16.0"
  "postcss@<8.5.23": "^8.5.23"
  "nanoid@<3.3.18": "^3.3.18"
