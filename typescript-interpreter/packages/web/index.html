<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets env(safe-area-inset-*) report real values, which the composer
         and other bottom-docked controls use to clear the home indicator on notched phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AFM Browser Runtime</title>
    <!--
      PRODUCTION headers (the real values, kept here so this comment can't drift from
      packages/web/public/staticwebapp.config.json again - that file is the one
      actually served; this is not itself enforced, since a strict <meta> CSP
      breaks Vite's dev server, and X-Frame-Options can't be set via <meta> at all):

        Content-Security-Policy: default-src 'self'; script-src 'self';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob: https:;
          font-src 'self' data:;
          connect-src 'self' https://api.openai.com https://api.anthropic.com
            https://registry.modelcontextprotocol.io https://raw.githubusercontent.com
            https://gist.githubusercontent.com <mcp-proxy-origin>;
          worker-src 'self' blob:;
          object-src 'none'; base-uri 'none'; form-action 'none';
          frame-ancestors 'none';
        X-Frame-Options: DENY

      <mcp-proxy-origin> is this deployment's proxy App Service host - see
      deploy/.env.deploy's PROXY_APP. It changes if that app is ever renamed.

      frame-ancestors/X-Frame-Options govern who may put THIS app in a frame - unrelated to
      the (currently removed) <afm-agent> widget, which was us framing someone else's page's
      content in an iframe we controlled, the opposite direction. They're 'none'/DENY because
      nothing has ever needed to frame this app, which is also what stops clickjacking: an
      attacker page can't overlay fake controls on a real one it isn't allowed to render. When
      embed returns, loosening this to 'self' (or an explicit partner list) is a deliberate
      decision to make then, not an oversight to fix - vite.config.ts's cspForMetaTag() also
      has to keep stripping frame-ancestors from the <meta> copy regardless of its value, since
      browsers ignore that directive there no matter what it says.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
